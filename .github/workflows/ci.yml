name: CI

# Renovate opens pull requests here, so something has to check them.
#
# The matrix is not decoration: the plugin resolves a working directory to a
# project by comparing paths, spawns and kills a detached server, and shells out
# to whatever opens a URL — three things every operating system does differently.
on:
  push:
    branches: [main]
  pull_request:

# Read is all this needs. Declared rather than inherited: the repository default
# is what a new workflow silently gets, and it is wider than this.
permissions:
  contents: read

# A pull request that is pushed to twice used to run the matrix twice, on three
# operating systems, with the first result already irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the state of the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # The runner context is not available in a job-level env block, only in
      # steps, so the database path is exported here instead.
      - name: Point the database at a scratch file
        shell: bash
        run: echo "CLAUDE_TASKS_DB=${{ runner.temp }}/ci-tasks.db" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Only for the portability check below; nothing else runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: bun install --frozen-lockfile

      - name: Types, including message keys
        run: bun run typecheck

      - name: Tests
        run: bun test

      - name: Message catalogues
        run: bun run lint:messages

      - name: MCP handshake and tool inventory
        run: bun scripts/mcp-smoke.ts

      - name: Database written by Bun is readable by Node
        run: node scripts/db-portability.mjs

      - name: Build
        run: bun run build

      # The README's pictures are committed, and a README pointing at a file
      # that no run produces is worse than one with no pictures at all. The two
      # groups are restored differently, so they are reported differently.
      - name: The README's pictures exist
        shell: bash
        run: |
          missing=0
          for shot in overview steps identity blocked; do
            if [ ! -s "docs/media/$shot.png" ]; then
              echo "docs/media/$shot.png is missing or empty. Run: bun run shots"
              missing=1
            fi
          done
          for shot in statusline; do
            if [ ! -s "docs/media/manual/$shot.png" ]; then
              echo "docs/media/manual/$shot.png is missing or empty. No run produces it: restore it from git."
              missing=1
            fi
          done
          exit $missing

      - name: Board starts, answers and stops
        # Exercises the spawn, pidfile and shutdown path, which is where the
        # differences between platforms actually bite.
        run: |
          bun bin/todos.ts serve
          bun bin/todos.ts status
          bun bin/todos.ts stop

      - name: The Bun launcher finds Bun without a shell profile
        # The failure this exists for is invisible: an MCP server that dies with
        # CONNECTION_CLOSED and nothing in any log. Unix only; on Windows the
        # remedy is an absolute path in .mcp.json.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin bash bin/mcp.sh < /dev/null
